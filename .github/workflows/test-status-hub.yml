name: Test Status Hub

on:
  pull_request:
    paths:
      - 'plugins/claude-status-hub/**'
  push:
    branches: [main]
    paths:
      - 'plugins/claude-status-hub/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run tests
        run: |
          chmod +x plugins/claude-status-hub/tests/*.sh
          plugins/claude-status-hub/tests/run-tests.sh
