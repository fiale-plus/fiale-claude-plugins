name: PR Gate
on:
  pull_request_target:
    types: [opened]

jobs:
  check-membership:
    runs-on: ubuntu-latest
    steps:
      - name: Check org membership
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const author = context.payload.pull_request.user.login;
            try {
              await github.rest.orgs.checkMembershipForUser({
                org: owner,
                username: author,
              });
              console.log(`${author} is an org member — PR allowed`);
            } catch {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: context.payload.pull_request.number,
                body: `This repo does not accept external pull requests. If you'd like to contribute, please open an issue first.`,
              });
              await github.rest.pulls.update({
                owner, repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed',
              });
              console.log(`${author} is not an org member — PR closed`);
            }
